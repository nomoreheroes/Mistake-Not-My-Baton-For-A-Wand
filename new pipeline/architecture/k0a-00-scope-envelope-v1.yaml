project_profiles_and_scenarios:
  profiles: [disposable_synthetic_fixture]
  scenarios: [F00]
  real_project_profiles: []

route:
  statement: command -> S0 -> synthetic Layer0 -> fixture worker -> atomic artifact version plus events -> terminal fixture sink and CLI readback
  current_reasoning_actors:
    - S0
    - synthetic_Layer0
    - fixture_worker
  current_deterministic_components:
    - basic_CLI
    - root_and_binding_guard
    - control_harness
    - model_adapter
    - artifact_event_store
    - bootstrap_sink
    - inspect_readback
  public_event_types:
    - command.received
    - run.started
    - artifact.version_created
    - handoff.ready
    - run.completed
  artifact_types:
    - bootstrap.synthetic_result
  terminal_states:
    - completed
    - blocked_input
    - blocked_policy
    - failed_invocation
    - failed_validation
    - failed_persistence

repository_boundaries:
  pipeline_git:
    root: C:/Projects/1.Mistake Not My Baton For A Wand
    access: read_only_during_F00_runtime
    current_planning_changes: K0a-00_governance_documents_only
  canonical_fixture_git:
    root: C:/Projects/1.Mistake Not My Baton For A Wand/projects/pipeline-v2-fixture
    access: read_only_identity_and_clean_baseline
  disposable_F00_run_root:
    location_policy: newly_materialized_or_cloned_temporary_fixture_root_outside_canonical_fixture_checkout
    access: write_only_within_exact_runtime_and_temporary_paths
  swarm_git:
    root: C:/Projects/1.Mistake Not My Baton For A Wand/projects/swarm
    access: none
  legacy_research:
    root: C:/Projects/1.Mistake Not My Baton For A Wand/research/old-swarm
    access: none

capability_and_egress_boundary:
  allowed:
    - read_pinned_pipeline_contract_bytes
    - read_fixture_identity_and_seed_spec
    - create_disposable_F00_runtime_state_under_exact_run_root
    - invoke_exact_pinned_model_provider_channel_for_three_reasoning_roles
    - read_back_F00_SQLite_state
  denied:
    - arbitrary_filesystem_write
    - product_repository_read_or_write
    - legacy_research_read
    - network_research
    - package_install_or_project_hook_execution
    - external_system_mutation
    - git_commit_push_merge_or_deploy_from_runtime
    - secret_access

explicit_exclusions:
  - operational_K0b_hardening
  - checkpoint_publisher
  - clone_only_SQLite_recovery
  - full_Alpha_event_profile
  - production_or_project_side_effects
  - legacy_research_import
  - full_P_R_E_G_A_H_T_I_Q_M_contracts
  - K0a-01_implementation_during_this_planning_package
  - K0a-02_implementation_during_this_planning_package
  - crash_reconciliation_resume_and_operational_abort
  - projection_outbox_and_YAML_Markdown_project_projections
  - distributed_leases_retries_budget_events_and_full_replay
  - dashboard_KPI_release_or_Alpha0_claims

deferred_triggers_and_stable_interfaces:
  K0a_implementation:
    trigger: explicit_owner_approval_of_all_three_exact_plan_versions_hashes_and_scope
    stable_interfaces:
      - validated_control_transition_request
      - validated_route_proposal
      - validated_artifact_event_publication_request
      - artifact_version_id_reference
      - replay_point_before_and_after_reference
  K0b_operational_delta:
    trigger: successful_F00_and_dispositioned_findings
    stable_interfaces:
      - versioned_event_envelope
      - versioned_invocation_envelope
      - forward_only_SQLite_migration_boundary
  downstream_layers:
    trigger: K0b_validated_baseline_and_later_just_in_time_layer_gate
    stable_interfaces:
      - S0_to_Layer0_validated_route
      - Layer0_to_worker_validated_invocation
      - artifact_version_and_event_refs

downstream_boundary:
  current_terminal_consumer: fixture_bootstrap_sink_plus_CLI_readback
  readiness_claim: K0a_bootstrap_evidence_only
  forbidden_claims:
    - Alpha0_ready
    - product_ready
    - replayable_from_clean_clone
    - production_safe
  implementation_scope_requested_after_owner_approval:
    - K0a-01_minimal_SQLite_atomicity_and_exact_replay_telemetry_schema
    - K0a-02_one_pinned_contract_S0_synthetic_Layer0_fixture_worker_basic_CLI_and_exact_guards
    - K0a-03_execute_F00_and_disposition_findings

