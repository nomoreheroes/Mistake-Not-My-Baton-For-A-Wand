manual_handoff_state_machine:
  states: [unbound, selected, prepared, awaiting_UI, captured, validating, accepted, failed, fenced]
  transitions:
    - unbound_to_selected_after_valid_selection_receipt
    - selected_to_prepared_after_exact_context_and_schema_hashes
    - prepared_to_awaiting_UI_after_operator_preflight
    - awaiting_UI_to_captured_after_raw_visible_output_and_evidence_capture
    - captured_to_validating_once
    - validating_to_accepted_after_all_checks
    - selected_or_prepared_or_awaiting_UI_or_captured_or_validating_to_failed_on_exact_failure
    - any_non_terminal_to_fenced_on_abort_or_stale_attempt
  undeclared_transition: reject
  concurrent_active_manual_handoffs: 1
  next_prepare_requires_prior_accepted_or_terminally_failed_and_reconciled: true
  operator_edit_of_rendered_input_or_raw_output: forbidden

capability_policy:
