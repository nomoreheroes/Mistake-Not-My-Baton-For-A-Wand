authoring_requirements:
  - Create one new shared artifact/event v2 successor file; do not edit the passing v1.1 plan or its review.
  - Preserve every passing v1.1 contract except exact D03 changes and bind the reviewed control v2 boundary.
  - Cover all 18 Layer Architecture Gate categories within shared-plane line budgets.
  - Define canonical artifact/event/phase/publication/outbox/checkpoint/seal schemas and forward migration sequence without implementing them.
  - Define compiler data-definition outputs, transactional projection outbox, checkpoint publisher sequencing, replay/materialization/reconciliation, crash consistency, idempotency and duplicate suppression.
  - Persist and enforce exactly two owner-approved real checkpoint budget phases, exact call chronology and only four stable F15 boundary trigger identities; a fifth or separate K0b-05 run blocks before effect.
  - Preserve one fixture chain, unchanged thresholds/storage/factor/seeds, batch cap 12, operational and F15 arithmetic, and cumulative chain observability.
  - Keep control as scheduler/policy owner, artifact/event as exclusive persistence/projector/publisher owner, and S as semantic route owner.
  - Define abort/late-result/compatibility semantics, observability, security and falsifiable acceptance criteria, including outbox/checkpoint/Git uncertain-result recovery.
  - Represent manual VS Code UI/model receipts only as persisted evidence received after control admission; do not infer a static model ID or grant transport/runtime authority.
  - Leave S v2 and its review for the separate ordinals 23 and 24; do not claim final D03 or owner approval.

