    - Forecast operational at 14/34 publications and 9437184/27262976 checkpoint bytes, producing 132120576/926941184-byte phase packs.
    - Forecast F15 at 8/22 window publications plus four explicit boundary triggers, 12/26 total publications, and 10485760/36700160 cumulative checkpoint bytes, producing 125829120/954204160-byte phase packs.
    - Invalidate the forecast and block if the F15 phase needs more than four boundary triggers, any post-F15 non-F15 model call, or more than 29 total worst-case publications.
    - Retain publication batch cap 12, pack delta factor 1.0, zero overlap/compression/dedup/cross-phase credit, exact F15 36/36, and runtime operational 16/30 without overlap.
    - Define compiler outputs, publisher sequencing, boundary seal, replay/reconciliation, crash consistency, idempotency, duplicate suppression, abort, late-result fencing, compatibility, observability, security, and falsifiable acceptance.
    - Demonstrate each checkpoint and phase pack is strictly below hard and each worst batch is below warning; retain clean-clone and cumulative-chain operational evidence requirements.
    - Make v2 forecast supersede v1 only for D03 partition and derived full-route pack totals; preserve the reconciled B01 seed arithmetic and D04 invocation totals.
    - Treat the addendum as a reviewed external D03 owner-route specialization of the existing three plans, not a silent rewrite, fourth layer plan, runtime contract, or approval receipt.
    - Surface exact manual model-selection receipts and final K0b approval as remaining gates; do not revive the accepted manual-UI residual-risk blocker.

