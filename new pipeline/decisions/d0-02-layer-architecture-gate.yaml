    - plan_path_version_sha256
    - parent_architecture_version_sha256
    - gate_contract_path_version_sha256
    - phase_package_and_project_profiles
    - author_identity_and_invocation_ref
    - reviewer_identity_model_provider_profile_and_invocation_ref
    - reviewer_fresh_context_and_conflict_declaration
    - review_rounds_and_finding_dispositions
    - complexity_tier_cap_and_actual_counts
    - current_and_deferred_roster_counts
    - invocation_budget
    - human_attention_budget
    - binary_payload_budget_ref_or_proved_not_applicable
    - forecast_reconciliation_ref
    - plan_section_presence_and_NA_reasons
    - exact_allowed_implementation_scope
    - owner_decision_actor_timestamp_and_exact_input_hashes
    - stale_conditions
  mandatory_stale_conditions:
    - plan_sha256
    - parent_architecture_sha256
    - gate_contract_sha256
    - referenced_registry_versions_and_hashes
    - bound_forecast_sha256
    - complexity_tier
    - approved_phase_package_and_profiles
  self_hash_rule: receipt_sha256 is computed with canonical-yaml-v1 after removing receipt_sha256; the enclosing approval envelope also records the complete-file SHA256.
  status_values:
    - approved
    - approved_with_disposition
    - narrowed
    - blocked

reference_tests:
  - Reject a multi-layer plan presented as one layer approval.
  - Reject an author of any prior/current plan version acting as reviewer.
  - Reject a reviewer with inherited author transcript or write capability.
  - Reject a third autonomous revision-return round.
  - Reject unknown route, invocation or human-attention bounds.
  - Reject a package without all human-attention fields or a phase aggregate presented as its substitute.
  - Reject execution of a high-attention package without its exact owner-capacity receipt; do not require a receipt from a phase envelope label alone.
  - Reject G or Q binary scope without a reconciled payload budget.
  - Reject an N/A binary budget when the contract can persist bytes.
  - Reject complexity overrun without an owner receipt.
  - Reject implementation whose scope exceeds the approval receipt.
  - Invalidate approval when any mandatory stale condition changes even if the plan omitted it.
  - Reject a receipt without gate-contract binding and canonical self-hash profile.
  - Prove deterministic validator evaluates only machine_checkable criteria and cannot synthesize reviewer judgment.
  - Reject a D0 approval envelope with duplicate/missing decision IDs or without dispositions, forecast, gate-contract and checkpoint-policy record roles.
  - Reject a receipt whose author/reviewer invocation refs do not resolve in the Pipeline design-invocation ledger.
  - Reject a binary budget whose aggregate exceeds either the reconciled planning bound or runtime aggregate limit even when every object fits its per-object cap.

