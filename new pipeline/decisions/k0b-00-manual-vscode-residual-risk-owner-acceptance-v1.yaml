accepted_residual_risks:
  - risk_id: K0b-RISK-MANUAL-UI-TOOL-EXPOSURE
    accepted_fact: >-
      The manual extension UI cannot provide machine-verifiable proof that its
      complete tool registry is empty even though actor tools and tool effects
      are forbidden by the reviewed executor contract.
    mandatory_controls:
      - operator_denies_every_tool_request
      - any_tool_request_even_if_denied_fails_the_attempt_and_is_recorded
      - any_observed_tool_effect_freezes_execution_as_a_security_incident
  - risk_id: K0b-RISK-MANUAL-UI-HIDDEN-TRANSCRIPT
    accepted_fact: >-
      Operator-captured extension-visible input, response, conversation, and UI
      evidence cannot prove completeness of hidden provider context or internal
      provider transcript state.
    mandatory_controls:
      - capture_and_hash_the_complete_extension_visible_conversation
      - declare_capture_completeness_as_manual_UI_visible_only
      - preserve_the_typed_hidden_context_gap_without_claiming_reproducibility
      - edited_redacted_or_incomplete_visible_capture_blocks_acceptance

