    - Harness hashes exact input, output, transcript, extension/model facts, timing, and capture-completeness fields.
    - Deterministic validation rejects unknown fields, tool requests, capability claims, route widening, wrong model, or incomplete transcript.
  switch_boundary: only_after_prior_invocation_is_accepted_and_replay_evidence_is_persisted_before_the_next_prepare
