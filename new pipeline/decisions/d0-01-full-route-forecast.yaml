    - retries_and_non_nominal_fallbacks
  new_plan_call_model: {nominal_author: 1, nominal_reviewer: 1, worst_case_total_with_two_returns: 6}
  delta_plan_call_model: {nominal_author: 1, nominal_reviewer: 1, worst_case_total_with_bounded_return: 4}
  compiled_fast_path_dispatcher_calls: 0
  checkpointed_invocations_exclude:
    - root_pipeline_layer_plan_authoring_and_review_before_project_runtime
  human_active_minutes_exclude:
    - waiting_for_agents
    - unattended_deterministic_tools
  postulated_phase_input_derivations:
    estimated_runs_per_phase: none_before_k0b
    estimated_external_tool_interactions: none_before_k0b
    asserted_irreversible_boundary_publications: none_before_k0b
    asserted_migration_or_gate_publications: none_before_k0b
    rule: These prefixed inputs are planning assertions or estimates, not measurements; K0-b must replace or retain them with evidence.
  program_worst_case_semantics: independent_per_metric_upper_bound_not_a_joint_reachable_scenario
