forecast_findings:
  - id: F-D0-01
    severity: serious
    finding: The full target route is a deep program; the revised model includes design-time layer-plan author/reviewer calls and requires K0-b/N1 program checkpoints.
  - id: F-D0-02
    severity: blocker_before_affected_phase
    finding: Per-project chains keep fixture and Swarm bytes separate. Nominal no-delta phase pack first exceeds hard stop at V1 and nominal Swarm checkpoint at Q1. Planning-worst pack first exceeds hard stop at fixture N1; planning-worst checkpoint first exceeds hard stop at Swarm V1. The separate 256-KiB replay sensitivity exceeds checkpoint hard stop at Swarm S1 while fixture remains 96 MiB at N1.
  - id: F-D0-03
    severity: serious
    finding: All downstream rows after a threshold crossing are conditional counterfactual branches, not an executable continuation or an expected Git-size forecast.
  - id: F-D0-04
    severity: moderate
    finding: V1 owner attention is approximately 8 nominal to 16 worst-case active hours and requires exact capacity authorization.

proposed_routes:
  foundation: Continue only K0-a/K0-b within approved package budgets; this worksheet does not authorize product execution.
  storage: Keep SQLite canonical and the tracked clean checkpoint as the current hypothesis. Measure K0-b; every warning/hard crossing requires narrow/batching, evidence-backed threshold change, storage migration reopening V2-D22, or pause.
  visual: V1-00 must reconcile G payload/publication assumptions and close the nominal pack hard-stop before V1-01; no first real asset may be written while unresolved.
  human_capacity: Phase profiles are aggregate envelope labels only. Require an exact owner capacity receipt before each package whose own human_attention.profile is high_attention; V1 contains two such packages and both must be authorized before execution.

