checkpoint_size_model:
  purpose: Recalculable D0 reference model; values remain hypotheses until K0-b measurement.
  project_db_invocation_scope: runtime_only; design-time calls are counted for cost and Pipeline ledger evidence but are not inserted into a project DB.
  checkpoint_chains:
    fixture: [K0a, K0b, N1]
    swarm: [S1, V1, AT1, I1, Q1, X1, M1]
  chain_rule: Each project chain starts at zero; prior_unrounded_checkpoint never crosses a project boundary.
  replay_points_per_checkpointed_llm_invocation: {nominal: 2, worst_case: 4}
  planning_new_unique_bytes_per_replay_point: {nominal: 16384, worst_case: 65536}
  sensitivity_range_bytes_per_replay_point: {low: 16384, high: 262144}
  high_sensitivity_checkpoint_projection_mib:
    fixture: {K0a: 10, K0b: 48, N1: 96}
    swarm: {S1: 200, V1: 624, AT1: 674, I1: 740, Q1: 1012, X1: 1102, M1: 1146}
  high_sensitivity_interpretation: Uses 256 KiB per replay point and policy-permitted binary maxima; it is a storage-risk sensitivity branch, not expected size.
  expected_unique_bytes_per_replay_point: unknown_until_k0b
  asserted_fixed_non_binary_growth_includes:
    - events_deliveries_and_indexes
    - non_binary_artifacts_and_decisions
    - tool_human_and_gate_replay_not_already_attributed_to_llm_calls
  asserted_fixed_non_binary_growth_derivation: none_before_k0b
  asserted_fixed_non_binary_growth_contribution_mib: {nominal: 68, worst_case: 134}
  replay_point_count_model:
    human_answer_or_approval_points_per_blocking_decision: 2
    external_tool_points_per_interaction: 2
    irreversible_side_effect_points_per_boundary: 2
    assumed_publisher_eligible_minutes_per_checkpointed_llm_invocation: {nominal: 1, worst_case: 3}
  window_publication_formula: max(ceil(total_replay_points / 10), ceil(publisher_eligible_runtime_minutes / 5), ceil(new_db_bytes / 32_MiB))
  overlap_credit_before_k0b: 0
  formula: prior_unrounded_checkpoint_in_same_project_chain + checkpointed_invocations * replay_points_per_invocation * planning_new_unique_bytes_per_replay_point + asserted_fixed_non_binary_growth + new_binary_payload
  display_rounding: ceil_to_whole_MiB
  caveat: Replay bytes and asserted fixed growth are not measurements; K0-b must replace them before they can become a release threshold.

pack_growth_model:
  formula: rounded_checkpoint_bytes * checkpoint_publications_per_phase * no_delta_factor
  no_delta_factor: 1.0
  no_delta_bound_assumptions:
    - no_credit_for_Git_delta_compression
    - SQLite_page_churn_may_reduce_similarity
    - VACUUM_or_equivalent_rewrite_may_replace_most_pages
    - new_media_BLOBs_may_be_incompressible
  expected_delta_factor: unknown_until_k0b
  expected_pack_growth: unknown_until_k0b
  program_sum_label: ungated_no_delta_upper_bound
  reachability_note: Rows after a warning/hard crossing are conditional branches and are not executable unless §9.5.1 owner disposition permits continuation.

