    exit-code handling, read-only probe, compatible wrapper/API invocation and
    manually corrected new uncommitted files within the same approved semantics,
    exact paths, locked dependencies, hosts, temp identities, session budget and
    two-commit contract. Inventory effects before retry; unknown effects block.
  evidence: record_attempts_before_freeze_and_disclose_post_freeze_repeats_in_final_report
  not_allowed_without_new_authority: >-
    Changed request bytes/baseline, additional semantic requirements or write/read
    path, third commit, extra implementation session/review/model/API call,
    dependency/host/network/runtime/gate/threshold/storage expansion or additional
    destructive target. Do not re-request authority for purely mechanical retries.

