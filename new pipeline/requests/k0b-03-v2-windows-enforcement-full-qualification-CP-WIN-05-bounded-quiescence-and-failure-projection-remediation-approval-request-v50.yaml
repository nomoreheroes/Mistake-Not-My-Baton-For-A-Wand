  "confirmed_code_defects": [
    {
      "defect": "CP_WIN_05_FAILED_CASE_PROJECTION_SCHEMA_MISMATCH",
      "facts": [
        "CP-WIN-05 stores forced_pre_Job_abort_result_code, forced_pre_Job_abort, created_suspended, assigned_before_resume, resume_called, job_messages, and accounting as custom evidence fields.",
        "failed_case_diagnostic_projection reads generic evidence.run and evidence.worker.",
        "The required CP-WIN-05 attribution was therefore emitted as run null and worker null."
      ]
    },
    {
      "defect": "CP_WIN_05_TIMING_SENSITIVE_IMMEDIATE_ACCOUNTING_PREDICATE",
      "facts": [
        "The normal-qualification identity run does not enter the bounded quiescence path.",
        "The normal branch performs an immediate Job accounting query and drains the completion port with timeout zero.",
        "CP-WIN-05 then treats immediate job_accounting.active_process_zero as a success requirement.",
        "This snapshot is weaker than the accepted bounded contract requiring ACTIVE_PROCESS_ZERO, final ActiveProcesses zero, and an empty final PID inventory."
      ]
    }
