mandatory_human_review_finding_carry_forward:
  - id: HR-NB-01
    rule: >-
      The runtime-phase publication value 34 is reforecast-sensitive. Any
      budget-input change invalidates the prior result and requires a new exact
      calculation.
  - id: HR-NB-02
    rule: >-
      An authoritative F15 worst_case_object_count must exist before any F15
      size-stress or phase-completion claim. No such authority is created here.
  - id: HR-NB-03
    rule: >-
      Future budget inputs and evidence must contain assumed_mean_object_bytes,
      nominal_expected_bytes, forecast_worst_by_count_bytes, and
      size_stressed_bytes.
  - id: HR-NB-04
    rule: >-
      The inputs 22020096, 12, and 34 require exact path and complete-file
      SHA-256 provenance tied to updated forecast v3 and forecast binary
      reconciliation v3. The value 22020096 is not claimed here to occur as a
      literal in either v3 file; its field-level source or derivation remains a
      required future closure proof.
  - id: HR-NB-05
    rule: >-
      STATE-RENDERER requires independent authoritative grounds. The later
      implementation disposition must enumerate all five gates that existed at
      human review, including the already closed HUMAN-SIGNOFF gate.

