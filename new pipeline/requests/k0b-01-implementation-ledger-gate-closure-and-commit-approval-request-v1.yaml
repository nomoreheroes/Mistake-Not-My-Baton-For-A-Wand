  confirmed_scope_remains_effective_until_objective_completion: true
  same_scope_technical_retry_without_new_hash_approval_allowed_when:
    - authorized_inputs_paths_outputs_and_semantics_are_unchanged
    - failed_attempt_has_no_authoritative_external_state_or_unapproved_write_effect
    - correction_changes_only_invocation_quoting_wrapper_or_compatible_tool_API_usage
    - every_attempt_and_correction_is_disclosed_in_the_closure_record
  new_owner_approval_is_still_required_when:
    - artifact_set_or_expected_semantics_change
    - read_or_write_scope_expands
    - dependency_network_runtime_state_gate_staging_commit_or_destructive_scope_expands
    - failed_attempt_effects_are_unknown_or_not_reversible
  same_scope_commit_retry_rule: >-
    A failed commit invocation may be retried without a new approval only when
    no commit was created, the exact staged bytes and path set remain unchanged,
    and the correction is invocation-only. Any created or ambiguous commit
    stops execution for owner-visible diagnosis.

