requested_implementation_contract:
  input:
    accepted_media_type: application_yaml
    encoding: UTF_8
    byte_order_mark: rejected
    document_count: exactly_one
    yaml_version: "1.2"
    schema: core
    parser: ruamel_yaml_safe_compose_with_preconstruction_event_and_node_validation
  reject_before_hash:
    - malformed_or_multiple_YAML_documents
    - duplicate_mapping_keys_before_or_after_NFC_normalization
    - merge_keys
    - aliases_or_anchors
    - explicit_or_implicit_tags_outside_the_YAML_1_2_core_JSON_compatible_set
    - non_string_mapping_keys
    - timestamp_binary_set_or_other_non_JSON_values
    - non_finite_numbers
    - Unicode_surrogates
    - missing_ambiguous_or_non_mapping_excluded_field_path
  excluded_field_path:
    external_representation: dot_separated_ASCII_identifier_segments
    segment_pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    traversal: exact_mapping_key_per_segment_before_NFC_normalization
    exactly_one_path_per_invocation: true
    target_must_exist: true
    delete_leaf_only_and_retain_parent_mapping: true
    currently_required_paths:
      - receipt_sha256
      - integrity.canonical_payload_sha256
  normalization:
    strings_and_mapping_keys: Unicode_NFC
    normalized_key_collision: rejected
    recursive_copy_without_input_mutation: required
  number_domain:
    integers: exact_IEEE_754_binary64_safe_integer_range_only
    minimum_integer: -9007199254740991
    maximum_integer: 9007199254740991
    floats: finite_IEEE_754_binary64_only
    negative_zero_serialization: "0"
    other_numeric_types: rejected
  canonical_encoding:
    standard: RFC_8785_JSON_Canonicalization_Scheme
    object_key_order: lexicographic_UTF_16_code_units
    number_serialization: ECMAScript_JSON_number_serialization_shortest_round_trip
    string_escaping: RFC_8785
    output: UTF_8_without_BOM_or_trailing_newline
  digest:
    algorithm: SHA_256
    representation: lowercase_hex_64
  public_surface:
    - parse_validate_and_normalize_yaml_bytes
    - canonicalize_validated_value
    - calculate_canonical_payload_sha256
    - verify_declared_canonical_payload_sha256
    - typed_fail_closed_error_codes
    - local_read_only_CLI_for_one_file_and_one_excluded_path
  side_effects:
    input_file_write: forbidden
    repository_write_from_verifier_or_CLI: forbidden
    network_subprocess_database_model_or_API_access: forbidden

toolchain_boundary:
  validation_environment:
