claim_reconciliation_policy:
  source_file_bytes_must_remain_unchanged: true
  primary_claim_outcomes:
    verified_match:
      effect: canonical_claim_is_machine_verified
    mismatch:
      effect:
        - preserve_original_claim_and_complete_file_bytes_as_history
        - record_declared_and_computed_values_in_immutable_successor_evidence
        - mark_original_canonical_claim_as_not_valid_for_future_verification
        - do_not_substitute_the_computed_value_into_the_historical_file
  derivative_evidence_outcomes:
    match_primary_declared_value: record_match
    mismatch_primary_declared_value: record_derivative_discrepancy
  complete_file_SHA_256_authority:
    affected_by_canonical_claim_match_or_mismatch: false
    reapproval_or_invalidation_inferred_by_verifier: forbidden
  gate_may_close_when:
    - verifier_and_all_reference_vectors_pass
    - all_six_primary_claims_have_exact_machine_results
    - all_four_derivative_occurrences_are_reconciled
    - every_mismatch_is_explicit_and_no_historical_file_is_rewritten
    - prospective_status_successor_binds_verifier_toolchain_vectors_inventory_reconciliation_and_validation_hashes
  unresolved_or_unclassified_claim: blocks_commit_and_gate_closure

