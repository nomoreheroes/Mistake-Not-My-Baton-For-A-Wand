ledger_governance_contract:
  lifecycle_states:
    - declared
    - authorized
    - materialized
    - validated
    - committed
    - credited
  additional_states:
    - rejected
    - superseded
    - stale
  semantic_separation:
    declared_implies_authorized: false
    authorized_implies_materialized: false
    materialized_implies_validated: false
    validated_implies_committed: false
    committed_implies_credited: false
    committed_implies_runtime_authorized: false
    any_state_implies_its_successor: false
  forbidden_actions:
    - self_authorization
    - skipped_required_state
    - mutation_or_replacement_of_an_existing_event
    - materialization_without_prior_exact_hash_authority
    - credit_from_a_missing_incomplete_or_ambiguous_reference
    - runtime_authority_inference_from_committed_or_credited
  credit_and_failure_rules:
    missing_incomplete_or_ambiguous_evidence: zero_credit
    stale_claim: zero_credit
    rejected_claim: zero_credit
    unknown_schema_profile_event_unit_gate_phase_or_state: fail_closed
    broken_predecessor_or_dependency_reference: fail_closed
    predecessor_or_dependency_SHA_256_mismatch: fail_closed
    duplicate_event_id_or_ambiguous_reference: fail_closed
  checkpoint_budget_phases:
    exact_count: 2
    exact_order:
      - K0b-runtime-operational
      - K0b-F15-exact-measurement
    chronological: true
    contiguous: true
    non_overlapping: true
    exhaustive_over_every_event: true
    third_or_unknown_phase: forbidden_fail_closed
    current_initial_population_phase: K0b-runtime-operational
    initial_population_completes_operational_phase: false
    initial_population_starts_or_completes_F15_phase: false
  immutable_event_minimum_fields:
    - schema_profile_version
    - event_id
    - unit_id
    - gate_id
    - checkpoint_budget_phase
    - event_type
    - resulting_state
    - predecessor_event_path_and_complete_file_SHA_256_or_explicit_null_for_declared_root
    - dependency_paths_and_complete_file_SHA_256_values
    - approval_request_path_and_complete_file_SHA_256
    - exact_confirmation_source_and_repeated_complete_file_SHA_256
    - artifact_paths_and_complete_file_SHA_256_values
    - evidence_paths_and_complete_file_SHA_256_values
    - budget_snapshot_and_input_provenance
    - credit_value_and_credit_eligibility
    - zero_credit_stale_rejection_or_supersession_reason_when_applicable
  event_immutability_rule: >-
    After creation under exact authority, an event file may never be edited,
    replaced, or reused. Corrections require a new immutable event that refers
    to the old event by exact path and complete-file SHA-256 and results in
    rejected, superseded, or stale as applicable.

budget_provenance_contract:
  updated_forecast_v3:
    path: new pipeline/evidence/k0b-00-updated-forecast-v3.yaml
    sha256: ed65d6e3c046c81c2e1e10efd4ac152bba5cd2cc1783b4d6b2102c788accdc8a
  forecast_binary_reconciliation_v3:
    path: new pipeline/evidence/k0b-00-forecast-binary-reconciliation-v3.yaml
    sha256: d3f9bd18ba15c2d7e791a8dc277011711cc8b7ef6788eb4c0ccdfecdfd2f71cb
  exact_hard_inputs:
    max_publication_bytes:
      value: 22020096
      literal_in_the_two_v3_sources: false
      required_hash_bound_derivation: >-
        Convert checkpoint_budget_phase_forecasts.K0b-runtime-operational.
        checkpoint_unrounded_MiB.total.worst_case from updated forecast v3, or
        phase_arithmetic.K0b-runtime-operational.checkpoint.unrounded_MiB.
        worst_case from reconciliation v3, to bytes using 1048576; subtract
        binary_budget_preserved.seed_bytes_nested.worst_case from updated
        forecast v3, or preserved_B01_D04_and_call_budget.binary_seed_bytes.
        worst_case from reconciliation v3; require both derivations to equal
        22020096 and bind both source paths and complete SHA-256 values.
    worst_case_object_count:
      value: 12
      exact_field_level_sources:
        - new pipeline/evidence/k0b-00-updated-forecast-v3.yaml#binary_budget_preserved.logical_seed_count.worst_case
        - new pipeline/evidence/k0b-00-forecast-binary-reconciliation-v3.yaml#preserved_B01_D04_and_call_budget.binary_seed_count.worst_case
    runtime_phase_publications:
      value: 34
      exact_field_level_sources:
        - new pipeline/evidence/k0b-00-updated-forecast-v3.yaml#checkpoint_budget_phase_forecasts.K0b-runtime-operational.publications.worst_case
        - new pipeline/evidence/k0b-00-forecast-binary-reconciliation-v3.yaml#phase_arithmetic.K0b-runtime-operational.publications.worst_case
      reforecast_sensitive: true
      any_change_marks_every_dependent_claim_stale: true
      stale_dependent_credit: 0
  required_budget_snapshot_fields:
    - assumed_mean_object_bytes
    - nominal_expected_bytes
    - forecast_worst_by_count_bytes
    - size_stressed_bytes
  field_provenance_rules:
    assumed_mean_object_bytes: >-
      Bind the exact v3 fields for nominal and worst binary seed byte counts
      and object counts; require both exact integer derivations 2236416/6 and
      4472832/12 to equal 372736.
    nominal_expected_bytes: >-
      Bind binary_budget_preserved.seed_bytes_nested.nominal in updated
      forecast v3 and preserved_B01_D04_and_call_budget.binary_seed_bytes.
      nominal in reconciliation v3; require both values to equal 2236416.
    forecast_worst_by_count_bytes: >-
      Bind binary_budget_preserved.seed_bytes_nested.worst_case in updated
      forecast v3 and preserved_B01_D04_and_call_budget.binary_seed_bytes.
      worst_case in reconciliation v3; require both values to equal 4472832.
    size_stressed_bytes: >-
      Bind new pipeline/evidence/k0b-01-b02-binary-size-recalculation-v1.yaml
      SHA-256 5ebc6ba23898521dc6547ead18b5dc5fc1c731b4d9ecb51df804a0689ad8d6e1
      field exact_calculation.size_stressed_binary_bytes and require 7864320.
  F15_worst_case_object_count:
    authoritative_value_available_at_this_baseline: false
    authoritative_value_required_before_size_stress_claim: true
    authoritative_value_required_before_phase_completion_claim: true
    missing_or_unbound_result: fail_closed_rejected_zero_credit
  non_budget_event_rule: >-
    Every event still carries the complete budget snapshot object and bound
    provenance, but may explicitly state that it makes no budget, size-stress,
    or phase-completion claim. Null or absent required fields are forbidden.

