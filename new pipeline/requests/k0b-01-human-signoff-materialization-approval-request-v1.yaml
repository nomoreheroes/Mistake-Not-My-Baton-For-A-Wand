    any change to it or another budget input requires a fresh exact calculation.
  K0B01-HR-NB02: >-
    Establish an authoritative F15 worst-case object count before an F15
    size-stress conclusion or second-phase completion claim.
  K0B01-HR-NB03: >-
    Include nominal expected bytes, forecast worst-by-count bytes, assumed mean
    object bytes, and size-stressed bytes in future budget inputs and evidence.
  K0B01-HR-NB04: >-
    Bind the exact forecast-v3 and reconciliation-v3 input paths and hashes that
    supply 22020096, 12, and 34 in the later implementation authority graph.
  K0B01-HR-NB05: >-
    Give G-K0B01-STATE-RENDERER an authoritative record and enumerate all five
    current K0b-01 gates in the later implementation disposition.

