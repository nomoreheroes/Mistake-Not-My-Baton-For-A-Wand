profile_id: pipeline-v2.state-projection-profile-v2
schema_version: 1
status: active
projection_version: "2.0.0"

repository_paths:
  source: new pipeline/state/state.yaml
  projection: new pipeline/state/STATE.md
  profile: new pipeline/state/renderer/k0b01/projection-profile-v2.yaml

source_contract:
  supported_schema_versions: [1]
  exact_top_level_order:
    - state_id
    - schema_version
    - projection_version
    - generated_at
    - status
    - projection_profile
    - baseline
    - active_authority
    - supporting_review_evidence
    - root_plan_status
    - work_items
    - open_gates
    - closed_gates
    - status_index
    - scope
  allowed_shape_sha256:
    - cccc6782fe25e2cc355b395bd6e4021128c2a6f47386d6683c20a8c86d8a7587
    - b6588ddd49ba3a4c62405f912abaac3ad475455117c186d8bb5d5b9713fdf9b3
    - c341d254b7125b68519975f5d726775d72087e315b98ab174dabe750f6b153bf
  absolute_host_paths: forbidden
  mapping_order: profile_exact
  unknown_fields: fail_closed

record_contracts:
  work_item:
    required_fields: [sequence, work_item_id, status, authority_path, authority_sha256, open_gate_ids]
    optional_fields: [completion_commit, effective_status_source, supporting_review]
  open_gate:
    required_fields: [gate_id, owner, status, blocks, closure_condition]
    optional_fields: []
  closed_gate:
    required_fields: [gate_id, status, closure_evidence]
    optional_fields: []
  status_index:
    required_fields: [path, sha256, embedded_status, effective_status]
    optional_fields: [effective_status_evidence, retained_evidence, superseded_by]

reference_contract:
  digest: SHA-256
  path_style: repository_relative_forward_slash
  missing_path: fail_closed
  hash_mismatch: fail_closed

gate_contract:
  open_statuses: [open_blocking, blocked_by_predecessor, future_open, blocked_by_predecessors]
  closed_status: closed
  cross_set_overlap: forbidden
  work_item_reference: required

document_contract:
  heading: "# Pipeline v2 state projection"
  notice: Generated projection; do not edit this file directly.
  normative_body: complete_source_YAML_bytes
  fence: yaml
  preamble_order: [heading, source_path, source_sha256, profile_path, profile_sha256, projection_version, notice, normative_body]

canonicalization:
  encoding: UTF-8-without-BOM
  line_endings: LF
  final_newline_count: 1
  timestamps_in_output: source_values_only
  environment_values_in_output: forbidden
  locale_values_in_output: forbidden

cli_contract:
  modes: [render, check]
  render_output: explicit_required
  check_mode_writes: false
  success_exit_code: 0
  validation_error_exit_code: 1
  invalid_input_exit_code: 2

non_authorizations:
  - no_reverse_or_bidirectional_state_update
  - no_source_mutation
  - no_implicit_render_output
  - no_runtime_or_implementation_authority
  - no_gate_state_inference_beyond_validated_source
