recommendation_rationale: >-
  Exact v1.1.0 is hash-valid, bounded to F-01/F-02, and resolves F-01 by
  declaring K0b-D03 activated and unresolved now without selecting an owner
  route. It also repairs most of F-02, preserves all passing ownership,
  event-profile, budget, security, replay, checkpoint, F04/F05, and external
  blocker contracts, and adds no implementation. Approval is still blocked
  because section 15 treats waiting -> completing as a positive transition
  while section 3's closed graph omits that edge. The plan needs one narrow
  consistency correction before approval; this recommendation is not owner
  approval and authorizes no implementation or physical call.
