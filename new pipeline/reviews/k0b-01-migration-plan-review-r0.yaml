        - publication_transactions.handoff_event_id_run_id_to_events.event_id_run_id
        - sink_acceptances.handoff_event_id_run_id_to_events.event_id_run_id
        - readback_gates.command_event_id_run_id_to_events.event_id_run_id
        - readback_gates.started_event_id_run_id_to_events.event_id_run_id
        - readback_gates.version_created_event_id_run_id_to_events.event_id_run_id
        - readback_gates.handoff_event_id_run_id_to_events.event_id_run_id
      self_referential_foreign_keys:
        - events.caused_by_event_id_run_id_to_events.event_id_run_id
    event_deliveries:
      outbound_foreign_keys: [event_deliveries.event_id_to_events.event_id]
      inbound_foreign_keys: [sink_acceptances.event_delivery_id_to_event_deliveries.event_delivery_id]
      composite_foreign_keys: []
      self_referential_foreign_keys: []
  closure_assessment: >-
    Rebuilding exactly the four selected tables can be feasible without copying an outside table,
    but only if the migration pins a SQLite-safe algorithm that keeps external child definitions
    pointing at the final table names and defers enforcement until all four final parents exist.
    The candidate does not provide that algorithm.
  required_single_valued_order: >-
    Not supplied by the candidate. It must specify connection-level PRAGMA state before BEGIN,
    BEGIN IMMEDIATE, creation and copy order for all four staging tables, the exact child-first
    drop order event_deliveries then run_state_transitions then events then runs, the exact
    parent-first final rename order runs then events then run_state_transitions then
    event_deliveries, recreation order for indexes and table-owned triggers, checks, and commit.
    It must also state whether foreign_keys is disabled before the transaction or
    defer_foreign_keys is enabled inside it, and prove the chosen method on the supported SQLite
    version. Renaming old parents as an intermediate step is unsafe because SQLite can rewrite
    external child FK targets to the temporary names.
  verdict: blocking_ambiguity_and_incomplete_dependency_procedure

historical_preservation_analysis:
  status: fail
  preserved_categories_claimed:
    - every_F00_ID_and_value
    - profile_and_state
    - event_type_and_version
    - subscriber_and_terminal_policy
    - lineage_and_revision
    - payload_text_bytes_and_digests
    - timestamps
    - uniqueness_relations
    - row_counts
  strengths:
    - Copy without coercion or default substitution is explicitly required.
    - Pre/post table counts, content digest, integrity checks, FK checks, and exact F00 graph readback are required before commit.
    - Historical migrations and K0a contracts are immutable.
  gaps:
    - >-
      The canonical content digest is not specified as an algorithm: table order, column order,
      SQLite storage class tags, NULL framing, integer encoding, text encoding, BLOB framing, and
      row ordering are not pinned. Therefore equal-digest historical preservation is not yet
      independently reproducible or falsifiable.
    - >-
      Payload "byte string" preservation is asserted for a TEXT column but the plan does not pin
      comparison as length(CAST(payload_json AS BLOB)) plus hex(CAST(payload_json AS BLOB)), or an
      equivalent byte-level rule. Value equality alone does not establish the stated byte claim.
    - >-
      "same or stricter historical semantics" is too broad: a stricter constraint can reject a
      historical value or future F00 operation. The plan must require exact historical constraints
      except for enumerated vocabulary widening.
  verdict: blocking_unfalsifiable_preservation_claim

backup_restore_idempotency_and_old_reader_analysis:
  status: fail
  backup:
    assessment: partially_specified
    verified_properties: [new_explicit_path, path_exclusions, independent_open, integrity, content_identity]
    gap: >-
      "verify its byte/content identity" does not select a criterion. SQLite Backup API output is
      a logical snapshot and need not have the same complete-file bytes as the live source. The
      plan must distinguish the backup artifact's own recorded SHA-256 from logical content
      equality to the source and pin both checks without requiring physical file equality.
  restore:
    assessment: adequate_at_plan_level_after_backup_criterion_is_fixed
    constraints: [verified_backup_only, distinct_new_path_only, no_down_migration, no_destructive_in_place_restore]
  idempotency:
    assessment: adequate_at_plan_level
    rule: exact_v4_identity_and_hash_yields_no_op_otherwise_block
  migration_row_and_user_version_order:
    assessment: adequate_at_plan_level
    rule: insert_exactly_one_v4_row_then_set_user_version_4_then_verify_before_commit
  old_reader_rejection:
    assessment: blocking_not_falsifiable_from_pinned_inputs
    gap: >-
      The plan requires every K0a reader to reject v4 but identifies no pinned K0a reader
      implementations, versions, entry points, or expected typed rejection. A temporary v4 database
      is sufficient as data, but generated databases and synthetic rows alone cannot prove behavior
      of unspecified reader code.

failure_atomicity_and_testability_analysis:
  status: fail
  transaction_atomicity_intent: one_BEGIN_IMMEDIATE_transaction_with_all_post_copy_checks_before_commit
  required_fault_points_present:
    - before_backup_creation
    - after_backup_verification
    - before_and_after_each_of_four_table_copy_swap_boundaries
    - before_v4_migration_row_insert
    - after_v4_migration_row_insert
    - immediately_before_commit
  exact_outcome_requirement_present: live_database_exact_v3_or_complete_v4_never_partial
  blocking_gaps:
    - >-
      "each of the four table-copy/swap boundaries" is not single-valued: copy and swap are
      separate operations, and the plan supplies neither exact statement labels nor the concrete
      order needed to map injections to every mutation boundary.
    - >-
      Connection loss/process termination tests must pin journal mode, synchronous durability
      assumptions, SQLite version, and reopening/recovery procedure; otherwise "exact v3 or
      complete v4" is platform/configuration dependent rather than falsifiable.
  synthetic_only_testability:
    testable_with_generated_temporary_databases_and_synthetic_rows:
      - schema_and_content_preflight
      - all_FK_shapes_and_self_reference
      - copy_swap_rollback_and_post_commit_recovery
      - backup_and_distinct_new_path_restore
      - idempotency_and_migration_order
      - historical_value_row_count_uniqueness_and_graph_preservation
      - forbidden_path_and_symlink_or_reparse_negatives_on_each_supported_platform
    not_testable_with_generated_temporary_databases_and_synthetic_rows_only:
      - requirement: every_K0a_reader_rejects_v4
        additional_pinned_input_needed: exact_historical_reader_implementations_and_expected_rejection_contract

