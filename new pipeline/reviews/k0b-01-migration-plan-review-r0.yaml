findings_external_blockers_and_recommendation:
  findings:
    - id: K0B01-MIG-R0-001
      type: schema_dependency_sqlite_swap_ambiguity
      severity: critical
      blocking: true
      status: open
      summary: The plan omits the complete FK inventory and a single-valued SQLite-safe four-table create-copy-drop-rename-recreate order.
      required_change: >-
        Add the full inventory recorded in this review; pin supported SQLite behavior and exact
        PRAGMA state; specify staging definitions, copy order, child-first drops, parent-first
        renames, index/trigger recreation, postchecks, and commit with no unsafe old-parent rename.
    - id: K0B01-MIG-R0-002
      type: historical_preservation_falsifiability
      severity: critical
      blocking: true
      status: open
      summary: The content digest and byte-preservation rules lack a canonical typed serialization and exact byte comparison.
      required_change: >-
        Pin a canonical per-cell digest format including storage classes, NULLs, ordering, framing,
        encodings, and BLOB/TEXT bytes; require exact historical constraints except enumerated widening.
    - id: K0B01-MIG-R0-003
      type: backup_identity_ambiguity
      severity: high
      blocking: true
      status: open
      summary: Backup byte identity is ambiguous and may be infeasible for SQLite Backup API output.
      required_change: >-
        Separate and pin the backup file's own hash from logical source/backup content equality and
        do not require physical file-byte equality to the source.
    - id: K0B01-MIG-R0-004
      type: old_reader_rejection_untestable
      severity: high
      blocking: true
      status: open
      summary: Universal K0a reader rejection is not testable because no reader artifacts or rejection contract are pinned.
      required_change: >-
        Enumerate and hash every in-scope K0a reader implementation/entry point and specify the exact
        unsupported-schema result; otherwise narrow the claim to a pinned reader set.
    - id: K0B01-MIG-R0-005
      type: failure_atomicity_platform_ambiguity
      severity: high
      blocking: true
      status: open
      summary: Fault boundaries and durable recovery assumptions are not exact enough to prove only complete v3 or v4 outcomes.
      required_change: >-
        Name every injectable SQL/adapter boundary and pin journal mode, synchronous assumptions,
        supported SQLite versions/platforms, process-loss method, reopen recovery, and exact v3/v4 fingerprints.
  open_blocking_finding_count: 5
  closed_blocking_finding_count: 0
  external_blockers:
    - id: K0B01-MIG-EXT-001
      blocking: true
      status: open
      summary: Exact K0a reader artifacts and rejection behavior are absent from the allowed hash-bound input set.
    - id: K0B01-MIG-EXT-002
      blocking: true
      status: open
      summary: Supported SQLite versions, platform matrix, and durability configuration are not pinned by the candidate.
  recommendation: revise
  rationale: >-
    The four-table closure appears potentially feasible, and the intended safety envelope is strong,
    but five open blocking findings leave dependency order, preservation, backup identity, old-reader
    rejection, and crash atomicity materially ambiguous. Approval is forbidden with open blockers.
