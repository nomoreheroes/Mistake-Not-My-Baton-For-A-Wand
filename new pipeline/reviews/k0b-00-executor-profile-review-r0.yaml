    rationale: >-
      Safety, routing, fallback, and fixture reviewer roles are locked to Claude;
      only non-authoritative fixture-worker output is assigned to ChatGPT.
      Unclassified roles, substitution, fallback, and mid-invocation switching
      block rather than widening authority.
