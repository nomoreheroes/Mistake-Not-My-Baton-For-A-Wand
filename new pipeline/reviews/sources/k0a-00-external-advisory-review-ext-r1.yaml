findings:
  - finding_id: EXT-001
    severity: high
    category: cross_plan_ownership_and_failure_route_coherence
    statement: >-
      The S plan v1.2.0 and the shared control plane plan v1.1.0 give directly opposite
      instructions for the same deterministic component. The S plan requires the harness to
      take one automatic retry transition on a transient pre-acceptance provider failure:
      "the deterministic harness automatically takes the single retry_pending transition; no
      new command or human trigger is required", with state path
      "retry_pending -> evaluating_attempt_2". The control plane plan, which owns the
      harness, states "K0a does not retry automatically", assigns provider
      timeout/unavailable to "failed_invocation; no automatic retry", and states that
      "Invocation or response failures terminate the run as failed_invocation". Because both
      plans would be approved together and neither is subordinate to the other, an
      implementer of K0a-02 has two conflicting authorities for whether the harness retries.
      This is a genuine fork in implementation authority with divergent observable
      behaviour: under the S plan a transient provider blip yields a second S0 call and a
      potentially completed F00 run; under the control plane plan the same blip terminates
      the run as failed_invocation. The conflict was introduced by the r2 revision: S plan
      v1.1.0 section 18 read "no automatic retry", consistent with the control plane, and
      v1.2.0 changed it to "exactly one automatic deterministic adapter retry" in order to
      close S-R1-001. The control plane's own section 12 compounds this by budgeting
      "one/two S0 calls" in the worst case while its sections 3 and 9 deny any mechanism
      that could produce the second call.
    evidence_refs:
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:48"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:72"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:122"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:127"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:198"
      - "new pipeline/architecture/k0a-00-shared-control-plane-v1.md:53"
      - "new pipeline/architecture/k0a-00-shared-control-plane-v1.md:55"
      - "new pipeline/architecture/k0a-00-shared-control-plane-v1.md:140"
      - "new pipeline/architecture/k0a-00-shared-control-plane-v1.md:174"
      - "new pipeline/reviews/sources/k0a-00-s-layer-plan-v1.1.0.md:199"
      - "new pipeline/reviews/k0a-00-s-layer-review-r2.yaml (judgment_checks.pass: bounded_retry_and_zero_human_coherence)"
      - "new pipeline/reviews/k0a-00-shared-control-review-r1.yaml (judgment_checks.pass: failure_security_and_replay_coherence, terminal_state_coherence)"
    why_not_dispositionable_by_wording_alone: >-
      Unlike S-R2-001, this conflict is not a summary row contradicted by the same
      document's contract sections. It is a state-machine and failure-taxonomy clause in one
      approved plan contradicted by a state-machine and failure-taxonomy clause in another
      approved plan. An owner disposition selecting the S plan reading would silently
      invert two judgment checks that an independent reviewer explicitly passed on the
      control plane at v1.1.0, on the assumption of no automatic retry. Under d0-02
      reviewer_judgment_requires_typed_finding_or_explicit_pass, inverting an explicit
      reviewer pass without any reviewer having assessed the inverted text is the specific
      outcome the independent-review contract exists to prevent.
    required_disposition: >-
      Owner-authorized revise_package_architecture, narrowly scoped to retry authority.
      Preferred route: issue shared control plane plan v1.2.0 stating the retry policy
      consistently with S v1.2.0 (one automatic adapter retry per reasoning-role delivery,
      pre-acceptance triggers only, new physical invocation identity, inside the declared
      3/6 runtime worst case), then a fresh-context independent review of that plan. The
      control plane has used one of its two permitted returns, so this fits its own return
      budget and requires no third autonomous S loop. Cost is two invocations against
      K0a-plan-bootstrap, taking the actual from 14 to 16 against a worst case of 18, so no
      budget variance route is triggered. The alternative route, reverting S to
      non-automatic retry, would reopen S-R1-001 and is not recommended.

  - finding_id: EXT-002
    severity: high
    category: evidence_integrity_machine_checkable
    statement: >-
      The owner disposition package declares a pipeline_seed_spec tree hash that does not
      resolve to any object in the repository. Declared value is
      8b60d12c2f831bc0603913d346ded8201da73561; the actual root tree of the declared seed
      commit 3021a7c05bb685be671a2bf205cfcc7996ec45d7 is
      8b60d12e418eb152bff1e25f86465eae6a7bbc58. The two values share only the first seven
      characters and then diverge, and "git cat-file -e" on the declared value fails, so it
      is not merely the wrong object but not an object at all. This matters beyond
      cosmetics: the same package lists
      "fixture_seed_commit_spec_sha256_fixture_commit_or_tree_changes" as a mandatory stale
      condition, so an approval receipt built on this package would bind its staleness
      guarantee to a value that can never be recomputed or compared. Under d0-02, an
      approval receipt must carry mandatory_stale_conditions, and reference test "Invalidate
      approval when any mandatory stale condition changes even if the plan omitted it"
      presumes every stale-condition value is resolvable. Note that the other three git
      object references in the same baseline_binding block (seed commit, canonical fixture
      commit, canonical fixture tree) were independently verified correct, and all eighteen
      file SHA-256 references in the package were independently verified correct, which
      isolates this to a single transcribed value rather than a systemic hashing problem.
    evidence_refs:
      - "new pipeline/evidence/k0a-00-owner-disposition-package-v1.yaml:13"
      - "new pipeline/evidence/k0a-00-owner-disposition-package-v1.yaml:100-109"
      - "verified: git rev-parse 3021a7c^{tree} = 8b60d12e418eb152bff1e25f86465eae6a7bbc58"
      - "verified: git cat-file -e 8b60d12c2f831bc0603913d346ded8201da73561 -> absent"
    required_disposition: >-
      Correct the value to 8b60d12e418eb152bff1e25f86465eae6a7bbc58 in the evidence package
      before any approval receipt is emitted, or remove the field if the seed-spec root tree
      is not intended to be a binding. This is an evidence-record correction, not a plan
      revision, so it does not consume a plan return round and does not alter any plan
      SHA-256. It does change the disposition package SHA-256, which the owner must re-bind.

  - finding_id: EXT-003
    severity: moderate
    category: validation_record_overstates_coverage
    statement: >-
      The mechanical validation record reports
      "owner_package_path_hash_resolution: {result: pass, refs_checked: 19}" and an overall
      "machine_checkable_criteria: pass", but the unresolvable tree hash in EXT-002 sits
      inside the very package that record validates. The validation therefore covered file
      path plus SHA-256 pairs but did not resolve git object references (commit and tree
      hashes) in baseline_binding, while presenting an unqualified pass. Separately, the
      same record asserts swarm HEAD 3fb16d7fcf6c6078e41fa82d238a35eab6458b39 with
      worktree_clean true and canonical fixture worktree_clean true. Those assertions are
      unverifiable by any reviewer operating under the stated independence rules, since rule
      6 forbids swarm access; they are author-attested facts presented inside a record whose
      value is that it is machine-checked. The risk is that a downstream deterministic
      validator or receipt treats "machine_checkable_criteria: pass" as covering more than
      it did.
    evidence_refs:
      - "new pipeline/evidence/k0a-00-validation-v1.yaml:10"
      - "new pipeline/evidence/k0a-00-validation-v1.yaml:29-30"
      - "new pipeline/evidence/k0a-00-validation-v1.yaml (gate_result.machine_checkable_criteria: pass)"
      - "new pipeline/evidence/k0a-00-owner-disposition-package-v1.yaml:13"
    proposed_disposition: >-
      Extend the validation check to resolve git object references, not only file digests,
      and re-run it after EXT-002 is corrected. Mark author-attested, non-reproducible
      assertions (swarm and fixture worktree cleanliness) with an explicit
      attested_not_machine_verified qualifier so they are not counted toward
      machine_checkable_criteria.

  - finding_id: EXT-004
    severity: moderate
    category: reviewer_independence_recording
    statement: >-
      The r2 S-layer review was performed under actor_id /root/review_s_r1, the same
      actor_id as the r1 review, with invocation_identity
      "/root/review_s_r1#review_round_2". Its own context_declaration states that "Existing
      context contained only the prior manifest-authorized independent S review", and it
      qualifies the independence claim as "fresh_context_relative_to_author: true". The
      review record is therefore candid that r2 was a continuation of the r1 reviewer's
      context, not a fresh context in the unqualified sense. The design invocation ledger,
      however, records the same invocation with a flat "fresh_context: true" and no
      qualifier, so the ledger states a stronger independence property than the review
      record it points to. The d0-02 reviewer_contract requires "fresh_context: true" and
      "separate_invocation_or_session: true" without a relative-to-author carve-out, and
      d0-02 reference tests include "Reject a reviewer with inherited author transcript or
      write capability". No author transcript inheritance is alleged or evidenced here, and
      the reviewer authored nothing, so the core independence property is intact; the defect
      is that the ledger and the review record disagree about the strength of the claim, and
      the ledger is the record an approval receipt resolves against.
    evidence_refs:
      - "new pipeline/reviews/k0a-00-s-layer-review-r2.yaml:7-8"
      - "new pipeline/reviews/k0a-00-s-layer-review-r2.yaml:12-16"
      - "new pipeline/ledgers/design-invocations.yaml:174-180"
      - "new pipeline/ledgers/design-invocations.yaml:205-220"
      - "new pipeline/decisions/d0-02-layer-architecture-gate.yaml:224-234"
      - "new pipeline/decisions/d0-02-layer-architecture-gate.yaml:340"
    proposed_disposition: >-
      Reconcile the ledger entry for k0a-00-review-s-r2 with the review record's own
      qualified declaration, and have the owner rule explicitly on whether
      fresh_context_relative_to_author satisfies d0-02 reviewer_contract.independence for a
      final-round review. If it does, state that as a gate interpretation so future rounds
      apply it consistently; if it does not, the r2 review needs a genuinely separate
      reviewer session. Distinct per-round actor_ids should be required going forward, since
      /root/review_s and /root/review_s_r1 established that convention and r2 broke it.

  - finding_id: EXT-005
    severity: low
    category: output_contract_identity
    statement: >-
      S-R2-001 as recorded: the S plan's scope-envelope table row states that S0 will
      "return a validated route proposal to the harness", whereas five numbered contract
      locations in the same document state that S0 returns raw s0_route_proposal and that
      only the harness validates and persists validated_route_proposal. This is a real
      inconsistency in the plan bytes and is correctly unresolved. This reviewer assesses it
      as low rather than moderate severity for implementation-authority purposes; see
      S_R2_001_assessment for the full independent reasoning.
    evidence_refs:
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:22"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:40"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:68"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:71"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:80"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:163"
      - "new pipeline/architecture/k0a-00-s-layer-v1.md:170"
    proposed_disposition: >-
      The binding disposition proposed by the owner is adequate and is endorsed without
      modification. See recommended_binding_disposition.

