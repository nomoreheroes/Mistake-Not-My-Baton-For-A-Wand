      model cannot select; identity separated from digest; artifact plus two events plus
      subscriber snapshots in one transaction; lineage traversable end to end; replay
      correctly scoped as read-only diagnostic retrieval with no clone-only or forensic
      claim. The honesty of the replay limitation is a strength.
  security_trust_prompt_injection_roots_capabilities_egress:
    result: pass
    assessment: >-
      Deny-all capability posture with one pinned provider exception; untrusted-content
      handling is explicit and consistent across all three plans; the injection boundary is
      stated as data-versus-authority rather than as filtering; security negatives name the
      enforcing component and require before/after zero-write proof, which is materially
      stronger than typical. Path escape, symlink/junction, ATTACH, extension load,
      trigger/pragma, and content-derived paths are each individually covered.
  current_and_deferred_roster:
    result: pass
    assessment: >-
      Rosters are genuinely minimal (one dispatcher, zero workers in S; zero LLM workers in
      both planes) and the deferred lists are honest and specific, with triggers named and
      no prompt or internal route designed ahead of approval.
  failure_retry_recovery_coherence:
    result: FAIL
    assessment: >-
      Coherent within each document, incoherent across documents. The S plan mandates one
      automatic harness-taken adapter retry; the control plane, which owns the harness,
      states twice that K0a performs no automatic retry and that a provider failure
      terminates the run. See EXT-001.
  hitl_autonomy_boundary:
    result: pass
    assessment: >-
      Runtime is Auto-only with zero blocking decisions; the sole HITL is pre-implementation
      owner approval, placed outside runtime; all three plans explicitly refuse to treat
      model output, fixture text, or file content as approval. The boundary is stated
      identically in all three plans, which is the correct redundancy for this rule.
  downstream_actual_consumption_evidence:
    result: pass
    assessment: >-
      Consumption is defined as a recorded act by a named consumer with exact IDs and fields
      read, and producer self-report is explicitly rejected in all three plans. The S plan's
      formulation is the sharpest: the validated route is "actually consumed only when the
      harness creates the matching synthetic Layer0 invocation", with shared causation and
      contract hashes required.
  falsifiability_of_tests_and_evidence:
    result: pass
    assessment: >-
      The scenario sets can fail. Negative and fault-injection cases are concrete
      (zero-row proofs, wrong-owner, forged approval, over-bound context, late-result
      fencing, corrupt ref blocking completion) and readiness is explicitly bounded to
      bootstrap evidence with forbidden claims enumerated in the scope envelope.
  implementation_scope_unambiguous_and_sufficient:
    result: FAIL
    assessment: >-
      Sufficient in breadth but not unambiguous. Two independent ambiguities exist in the
      package: the retry-authority conflict (EXT-001), which would cause two implementers
      reading two approved plans to build different harnesses, and the S-R2-001 wording
      (EXT-005), which is documentary rather than behavioural. Only the second was
      dispositioned.
  no_third_autonomous_revision_return_loop:
    result: pass
    assessment: >-
      Confirmed from the ledger and the review records. S used exactly two returns and
      stopped; the r2 review terminated as blocked_revision_limit_exhausted and routed to
      owner disposition rather than initiating a third author call. The control and
      artifact/event plans used one return each. The gate limit was respected.

