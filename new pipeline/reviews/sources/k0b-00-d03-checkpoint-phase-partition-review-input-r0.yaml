review_rubric:
  - Verify every pinned input hash before substantive review and stop on mismatch.
  - Decide explicitly whether the existing policy and K0b scope permit two separately gated checkpoint phases inside the same K0b fixture chain, or whether this is an invalid renaming of one K0b phase/batches that requires policy or scope revision.
  - Verify the owner-selected route is an explicit registered narrow_or_checkpoint_batching specialization and does not silently raise thresholds, change storage, claim compression/delta/overlap credit, or hide cumulative chain growth.
  - Verify the two phases are chronologically and semantically exhaustive: all non-F15 physical model calls finish before the operational seal; F15 has exactly 36 calls; post-F15 K0b-04/K0b-05 is deterministic with zero model calls.
  - Verify any need for a post-seal non-F15 model call, a fifth F15 boundary trigger, publication 30, unclassified trigger, or overlapping membership invalidates the forecast before effect.
  - Independently recompute replay points, window limits, trigger counts, checkpoint rounding, phase packs, batch counts, margins, combined observability totals, effective 24-call design cap, and full-route totals.
  - Verify operational 926941184 and F15 954204160 worst packs are each strictly below 1073741824, checkpoints below 104857600, and largest batches below 536870912 under factor 1.0 and zero credit.
  - Verify compiler outputs, ownership, publisher/outbox sequencing, seals, replay/reconciliation, crash consistency, idempotency, duplicate suppression, abort, late results, compatibility, observability, security, and acceptance are single-valued and consistent with all three plans.
  - Verify all 18 scoped Layer Architecture Gate categories are present and the addendum stays within 350 non-empty lines.
  - Verify the addendum is legitimately an external D03 route specialization rather than an unreviewed fourth layer plan or a semantic change that makes the existing plan/scope hashes stale.
  - Verify v2 supersession preserves B01 seed arithmetic, D04 exact F15 and operational call budgets, historical v1 evidence, and no implementation or physical-call authority.
  - Report typed blocking findings for any unsupported policy interpretation, chronological gap, underestimated trigger/call allocation, arithmetic error, cross-plan conflict, or non-falsifiable acceptance claim.

