  - Verify every exact input hash before substantive review and stop on mismatch.
  - Verify the profile implements K0b-D01 as separately_pinned_harness_adapter on manual Visual Studio Code UI only, with no direct API path.
  - Verify the fixed Claude safety and ChatGPT fixture-worker role partition is closed, unclassified roles block, and fallback or mid-invocation switching is forbidden.
  - Verify model identity is selected manually before dispatch and bound by an exact hashed receipt rather than statically selected by the author.
  - Verify all 36 F15 attempts lock one Claude extension and one manually selected UI model identity; drift invalidates comparability without hidden restart credit.
  - Verify extension identity, capability, egress, transcript, schema-validation, replay, duplicate, crash, abort, late-result, compatibility, observability, and security contracts are single-valued.
  - Verify manual-UI limitations are not overstated: denied effects are not proof of zero exposed tools, visible capture is not proof of complete hidden transcript, and both gaps remain explicit pre-dispatch blockers pending owner acceptance.
  - Verify exact D01 fields are present and profile SHA-256 is bound externally without impossible self-reference.
  - Verify D03 remains a separate hard-stop blocker and the profile neither closes it nor authorizes runtime work, physical calls, fixtures, contracts, migrations, prompts, projections, checkpoints, or canonical-fixture changes.
  - Verify authorship ledger entry resolves to the exact author-input and profile hashes and the effective 24-call design budget leaves 9 calls before this review and 8 after it.
  - Distinguish approval of this exact review-candidate contract from owner residual-risk acceptance, K0b architecture approval, or dispatch authorization.
  - Report explicit machine checks, independent judgment, typed findings, blockers, and one recommendation.

