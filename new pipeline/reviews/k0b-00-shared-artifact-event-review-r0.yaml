    rationale: >-
      The plan requires exact graph/reference checks, fault injection at DB,
      projection, snapshot, Git, migration, backup, and restore boundaries,
      duplicate/conflict cases, clean-clone F13a, security negatives, and raw
      storage measurements. Missing telemetry blocks the affected claim.
  implementation_scope_is_unambiguous_and_sufficient:
