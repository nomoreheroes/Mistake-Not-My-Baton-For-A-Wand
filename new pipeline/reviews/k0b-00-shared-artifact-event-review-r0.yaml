    rationale: >-
      S owns semantic route meaning and freeze decisions; shared control owns the
      generic compiler, scheduling, ordering, and request policy; this plane owns
      canonical artifact/event definitions, durable persistence, projections, and
      checkpoint publication. The provisional sibling agrees that it never writes
      checkpoint or projection bytes.
  current_roster_is_minimal_and_deferred_roster_is_honest:
    result: explicit_pass
    rationale: >-
      Seven deterministic components cover validation, atomic write, subscription,
      projection, checkpoint, replay/reconciliation, and compatibility. The plane
      has zero LLM workers and defers product catalogs, dialogue, generalized retry,
      distributed publication, external storage, scale, and M subscribers.
  tests_and_evidence_can_falsify_the_architecture:
