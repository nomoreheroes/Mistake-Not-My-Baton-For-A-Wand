prior_finding_closure_matrix:
  - id: K0B01-MIG-R0-001
    prior_severity: critical
    prior_blocking: true
    disposition: closed
    evidence:
      - Plan v1.2 section 3 enumerates every internal and external FK incident to the four rebuilt tables and the exact one-index, eleven-trigger owned-object set derived from migrations 0001 through 0003.
      - Plan v1.2 section 4 fixes final-name staging references, forbids old-parent rename, and specifies create, copy, child-first drop, parent-first rename, object recreation, verification, and commit order.
      - Foreign keys are disabled and read back before BEGIN IMMEDIATE, then re-enabled and checked after commit on the sole supported SQLite 3.45.3 row.
  - id: K0B01-MIG-R0-002
    prior_severity: critical
    prior_blocking: true
    disposition: closed
    evidence:
      - Plan v1.2 section 5 defines the binary digest header, table and column ordering, length framing, PK-tuple row ordering, storage-class tags, integer and real encodings, exact UTF-8 and BLOB payloads, and row-count framing.
      - Historical projections exclude only explicitly manifested v4 additions and separately compare payload_json and fields_read_json byte length and hex values.
      - Section 3 removes the prior same-or-stricter ambiguity and permits changes only to the enumerated CHECK vocabulary locations while requiring exact F00 behavior elsewhere.
  - id: K0B01-MIG-R0-003
    prior_severity: high
    prior_blocking: true
    disposition: closed
    evidence:
      - Plan v1.2 section 6 expressly rejects source-to-backup physical-byte equality as a norm.
      - It separately records the closed backup artifact hash, verifies that hash on reread, and requires independently reopened backup schema/content equivalence with the source.
      - Restore is verified-backup-only, targets a distinct validated new path, and forbids down migration and in-place restore.
  - id: K0B01-MIG-R0-004
    prior_severity: high
    prior_blocking: true
    disposition: closed
    evidence:
      - Plan v1.2 section 8 narrows the claim to three complete-file-hash-bound reader implementations and their initialize entry points.
      - Static inspection confirms each entry point raises MigrationError with exact text unsupported schema version 4 when user_version is 4.
      - The required synthetic-v4 tests assert the exact type/message and unchanged database/file set without authorizing any K0a edit.
  - id: K0B01-MIG-R0-005
    prior_severity: high
    prior_blocking: true
    disposition: closed
    evidence:
      - Plan v1.2 sections 2 and 7 pin Windows Server 2022, AMD64, CPython 3.12.7 Anaconda, sqlite module 2.6.0, SQLite 3.45.3, WAL, synchronous FULL, and exact reopen recovery.
      - Deterministic B, T, C, D, R, S, M, and V boundary IDs cover backup, transaction entry, each table copy/drop/rename, schema objects, migration row, user_version, verification, and immediately-before-commit.
      - Ordinary exceptions are required at every boundary and process termination at post-mutation boundaries, with exact-v3 rollback or complete-v4 success assertions including schema, content, FK graph, WAL/SHM, and restore checks.
