verbatim_non_blocking_findings:
  - finding_id: K0B01-HR-NB01
    classification: non_blocking
    text: >-
      Запас по публикациям — ровно одна. При checkpoint 29 MiB предел 35 публикаций (1,064,304,640); 36 пробивают лимит (1,094,713,344). Аналогично checkpoint может вырасти лишь до 30 MiB. Маржа 3.71% — это не «комфортно», это «одна единица». Стоит зафиксировать 34 как величину, требующую reforecast при любом изменении.
  - finding_id: K0B01-HR-NB02
    classification: non_blocking
    text: >-
      Обязательство по F15 не квантифицировано. Оба документа корректно требуют независимой проверки второй фазы, но ни в одном авторитетном источнике для F15 нет worst\_case\_object\_count — её new\_db\_bytes worst 9,437,184 заданы напрямую, а не как count × mean (9,437,184 / 372,736 не целое). То есть size-stress для F15 сегодня посчитать нечем. Запас есть: F15 выдерживает checkpoint до 39 MiB (1,063,256,064), 40 MiB пробивают. Это \~4 MiB uplift'а — деферрал не формальность, ему нужен собственный object count.
  - finding_id: K0B01-HR-NB03
    classification: non_blocking
    text: >-
      Recalculation фиксирует только величину №3 из трёх обязательных по v1.3 §6. Нет assumed\_mean\_object\_bytes, nominal expected и forecast worst-by-count. Значения выводимы (2,236,416 / 6 = 4,472,832 / 12 = 372,736 из reconciliation v3), и mean 372,736 даёт здоровый зазор 1.76× до нового потолка 640 KiB — но в самом артефакте этого не видно.
  - finding_id: K0B01-HR-NB04
    classification: non_blocking
    text: >-
      Authority-блок recalculation не цитирует собственные входы. Указаны disposition, v1.3, checkpoint policy — но не forecast v3 и не reconciliation v3, откуда физически берутся 22,020,096, 12 и 34. Цепочка идёт через прозаический текст v1.3 §6, который эти хэши тоже не называет. Не dangling reference, но разрыв трассируемости для hard-budget чисел.
  - finding_id: K0B01-HR-NB05
    classification: non_blocking
    text: >-
      G-K0B01-STATE-RENDERER существует только в state-проекции. Единственное место в графе — state/state.yaml и STATE.md, а v1.3 §2 прямо объявляет проекции «governance navigation aids; authority remains the cited complete-file hashes». При этом список из семи предпосылок в v1.3 §11 renderer не содержит. По собственному правилу плана этот блокирующий gate не подкреплён авторитетом. Направление ошибки консервативное (лишний блокер, не лишнее разрешение), проекции сейчас взаимно согласованы, поэтому не blocking — но в implementation disposition стоит перечислить все пять gates и дать renderer'у авторитетную запись.

