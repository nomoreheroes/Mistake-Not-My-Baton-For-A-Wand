    findings:
      duplicate_key_tool_transcript_bypass:
        severity: high
        observation: Python JSON parsing accepted duplicate keys, allowing a raw command_execution item to be shadowed by a later agent_message item and qualify three unsafe receipts for publication.
        disposition: resolved_by_recursive_duplicate_key_and_nonstandard_constant_rejection_for_fixed_receipts_response_JSON_and_each_transcript_JSONL_event
      non_atomic_initial_run_start:
        severity: high
        observation: Run creation, the created-to-running transition, and the two initial control events committed separately and could strand a partial run after a crash.
        disposition: resolved_by_one_SQLite_transaction_for_run_transitions_events_and_deliveries_with_fault_injection_rollback_coverage
      incomplete_recovered_dispatch_request:
        severity: medium
        observation: Recovery after durable dispatch but before request write omitted the pinned execution_mode field.
        disposition: resolved_by_exact_full_request_reconstruction_and_byte_equivalent_regression
