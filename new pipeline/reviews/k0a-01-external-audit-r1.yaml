findings:
  - id: B-1
    severity: blocking
    title: SQL migration bytes did not survive a Windows clean checkout
    reproduction: A clean clone with core.autocrlf=true checked out 0001_k0a01.sql as CRLF, changed its SHA-256, and caused initialization and all 25 tests to fail.
    required_fix: Add an owner-authorized '*.sql text eol=lf' rule to .gitattributes.
  - id: NB-1
    severity: non_blocking
    title: Fixture cleanliness test did not bind safe.directory explicitly
    reproduction: Git returned dubious-ownership status 128 instead of reporting fixture cleanliness.
    required_fix: Use an exact command-scoped safe.directory value and distinguish an absent fixture checkout.
  - id: NB-2
    severity: non_blocking
    title: K0a-01 completion gate existed only in the Python API
    reproduction: Direct SQL could update a run to completed before the K0a-02 sink/readback gate.
    required_fix: Enforce the temporary completion prohibition in SQLite until K0a-02 replaces it with the real gate.
  - id: NB-3
    severity: non_blocking
    title: Migration hash guard did not verify the live schema
    reproduction: Dropping an immutability trigger was not detected by a later initialize call although schema_fingerprint changed.
    required_fix: Compare the live schema fingerprint with an expected schema built from the exact migration bytes.
