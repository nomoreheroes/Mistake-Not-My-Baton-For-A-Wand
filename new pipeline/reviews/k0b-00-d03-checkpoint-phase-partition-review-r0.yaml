  current_policy_threshold_scope: per_project_checkpoint_chain
  current_D0_phase_identity: K0b
  proposed_new_threshold_unit: checkpoint_phase_id_within_K0b
  judgment: invalid_threshold_denominator_reinterpretation_requires_policy_and_scope_change
  result: fail
  rationale: >-
    The policy says threshold scope is always per_project_checkpoint_chain, and
    the bound D0 forecast defines K0b as the phase row in the fixture chain.
    The prior owner disposition requires batching while retaining aggregate
    phase-pack hard-stop enforcement; v1 reconciliation explicitly says
    batching does not erase the same-K0b aggregate and forbids phase-scope
    reinterpretation. A later owner record may select a registered route but
    cannot make two newly named checkpoint_phase_id values independent policy
    denominators without an explicit policy/scope amendment and affected-plan
    review. Treating the 1.881 GiB combined chain sum as observability-only is
    therefore threshold gaming under the currently pinned authority.

