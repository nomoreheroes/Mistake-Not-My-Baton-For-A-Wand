      type: policy_scope_reinterpretation
      severity: blocker
      status: open
      summary: >-
        Applying the 1 GiB limit independently to two new checkpoint phases
        inside the existing K0b phase is not authorized by the pinned policy,
        base forecast, scope, or prior owner disposition.
      required_disposition: >-
        Either revise and approve the policy/scope/affected plan hashes to make
        checkpoint_phase_id an explicit threshold unit, or retain one K0b
        denominator and choose genuine narrowing, storage, threshold, or pause.
    - finding_id: F-02
      type: chronological_and_call_allocation_gap
      severity: blocker
      status: open
      summary: >-
        Zero post-F15 non-F15 calls and completion of all 16/30 operational
        calls before the seal are asserted but not established by the reviewed
        K0b-01 through K0b-05 plans.
      required_disposition: >-
        Produce an exact reviewed per-work-item/per-scenario call allocation and
        execution order, revising affected plans if this narrows their semantics.
    - finding_id: F-03
      type: underestimated_or_unproved_boundary_trigger_allocation
      severity: blocker
      status: open
      summary: >-
        The four-trigger F15 cap lacks an exhaustive stable-ID mapping for the
        K0b-04 F15 boundary and post-F15 K0b-05 run, wait, and program gate.
      required_disposition: >-
        Enumerate every mandatory trigger and prove a non-overlapping total at
        or below four; otherwise reforecast before effect.
    - finding_id: F-04
      type: cross_plan_compatibility_and_staleness
      severity: blocker
      status: open
      summary: >-
        The addendum changes the phase accounting unit and operational
        chronology while the three unchanged plans still bind one K0b phase,
        14/34 publications per K0b phase, and unallocated 16/30 calls across
        K0b-01 through K0b-05.
      required_disposition: >-
        Obtain explicit plan-revision authority and fresh reviews for every
        affected exact plan, or redesign the route without changing those semantics.
