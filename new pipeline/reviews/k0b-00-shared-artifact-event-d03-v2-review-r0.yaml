typed_findings:
  - finding_id: F-01
    type: ambiguous_and_regressive_artifact_event_publication_cardinality
    severity: high
    blocking: true
    status: unresolved
    location: reviewed_plan.section_4.atomic_persistence_route.artifact_event_publication
    observed_text: version_plus_exact_21_profile_events_plus_immutable_subscriber_snapshots
    evidence: >-
      The passing v1.1 route requires an artifact version plus required events
      selected from the exact 21-event profile, while the v2 route can only
      literally be read as emitting all 21 semantic events for every artifact
      publication. That would fabricate incompatible lifecycle, approval,
      error, abort, and incident events, and it conflicts with the fixed
      semantic event catalog and terminal policies. It is not an authorized
      D03 phase-partition change and no deterministic event-selector rule is
      supplied to remove the ambiguity.
    required_disposition: >-
      Replace the phrase with an unambiguous rule that one publication emits
      only its control-admitted required event subset, each selected from the
      immutable exact 21-event compiled profile and materialized with the
      applicable immutable subscriber and terminal snapshots. Preserve the
      existing atomicity and reject an event outside that profile.
    authority_effect: plan_revision_required_before_approval_or_runtime; no_owner_approval_issued

