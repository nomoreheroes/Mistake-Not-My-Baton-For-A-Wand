findings:
  - finding_id: F-01
    type: ambiguous_revision_owner_and_target_contract
    severity: high
    blocking: true
    affected_gate_categories: [4, 6, 9, 14, 15]
    statement: >-
      F05 does not define one implementable revision-owner target. The route
      table says S resolves the producing upstream zero, but the following
      paragraph says S resolves semantic ownership to the producer invocation
      of the invalidated artifact version, and later sections say only that S
      names a semantic owner before control compiles replay. A historical
      producer invocation is evidence and identity, not necessarily the
      upstream-zero dispatcher role that the parent F05 route and provisional
      control delta require control to schedule. The current
      pipeline-v2.s-revision-owner-proposal identity has no stated field split
      that disambiguates those meanings.
    evidence_refs:
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#2-dispatcher-deterministic-harness-compiler-and-plane-boundaries
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#4-input-events-guards-routing-fan-out-barriers-and-fast-paths
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#6-artifacts-ownership-versioning-lineage-and-key-decisions
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#9-failure-taxonomy-revision-replay-recovery-abort-and-duplicates
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#14-downstream-consumers-and-proof-of-actual-consumption
      - new pipeline/PIPELINE_V2_ARCHITECTURE_PLAN.md#204-skeleton-end-to-end-scenarios-on-committed-fixture
      - new pipeline/architecture/k0b-00-shared-control-plane-delta-v1.md#4-inputs-guards-routing-branches-fan-out-barriers-and-fast-paths
    impact: >-
      Implementations could schedule the historical producer, schedule an
      upstream-zero dispatcher, or bypass that dispatcher and let control replay
      directly. Those choices assign semantic repair authority differently and
      cannot all satisfy the same closed compiler/reference tests.
    proposed_disposition: >-
      Revise the F05 contract to name exactly one scheduled revision owner. If
      the intended parent-compatible route is the upstream zero, require separate
      fields such as revision_owner_zero_role_id and producer_invocation_id, make
      the latter lineage evidence only, state that control validates both and
      schedules the exact zero role, and state who selects any deeper worker.
      If S is intentionally being granted different ownership, route that change
      through an explicit parent/scope owner decision instead of inferring it.

  - finding_id: F-02
    type: contradictory_F04_duplicate_result_semantics
    severity: high
    blocking: true
    affected_gate_categories: [4, 9, 15]
    statement: >-
      F04 duplicate handling is not single-valued. Section 4 permits the
      all_required barrier after one valid terminal result from each immutable
      member. Section 9 groups any duplicate reviewer result with missing and
      incompatible results and says completion remains blocked. The reviewed
      artifact/event sibling instead requires a matching duplicate to return the
      original result and only a non-matching duplicate to block. The S plan's
      later duplicate rule is limited to proposals and does not repair the
      reviewer-result conflict.
    evidence_refs:
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#4-input-events-guards-routing-fan-out-barriers-and-fast-paths
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#9-failure-taxonomy-revision-replay-recovery-abort-and-duplicates
      - new pipeline/architecture/k0b-00-shared-artifact-event-plane-delta-v1.md#9-failure-taxonomy-invalidation-replay-recovery-abort-and-duplicate-suppression
      - new pipeline/reviews/k0b-00-shared-artifact-event-review-r1.yaml#machine_checks
    impact: >-
      The same identical redelivery can either preserve a satisfiable barrier or
      permanently block it, so F04 idempotency, crash recovery, and acceptance
      evidence cannot be compiled to one deterministic result.
    proposed_disposition: >-
      Split reviewer duplicates explicitly: an identical duplicate with the same
      member, identity, canonical bytes, and causation returns the original
      terminal disposition, contributes no second count, and does not prevent
      all_required satisfaction; reuse with different bytes, member, or causation
      is a blocker and incident. State that S consumes the deduplicated logical
      result set or define the equivalent exact boundary.

  - finding_id: F-03
    type: incomplete_compiled_nominal_semantic_transition
    severity: medium
    blocking: true
    affected_gate_categories: [3, 4, 15]
    statement: >-
      The normative semantic state machine ends the compiled nominal branch at
      compiled_nominal, while the route table separately says control schedules
      that branch without an S0 or Layer0 call. No explicit semantic edge or
      closed handoff maps compiled_nominal to scheduled or route_frozen, even
      though every transition is said to be control-validated and freeze must
      prevent new deliveries.
    evidence_refs:
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#3-semantic-state-machine-invariants-and-terminal-states
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#4-input-events-guards-routing-fan-out-barriers-and-fast-paths
      - new pipeline/architecture/k0b-00-s-layer-delta-v1.md#16-evidence-observability-acceptance-and-readiness-criteria
    impact: >-
      A closed graph compiler must either invent an undeclared transition or
      treat the primary fast path as terminal, and implementations can disagree
      about whether a concurrent freeze is checked before scheduling.
    proposed_disposition: >-
      Add the exact compiled-nominal handoff to the semantic graph, for example
      compiled_nominal to scheduled or route_frozen after the control-owned
      freeze guard, or explicitly declare compiled_nominal a terminal S
      disposition and define one closed control transition table with the same
      outcomes. Add positive and frozen negative reference cases.

