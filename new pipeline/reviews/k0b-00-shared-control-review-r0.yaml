      The exact plan can be read as ready without the storage/batching owner
      route even though the pinned authoritative worst-case package forecast is
      already above the warning threshold. This conflicts with the common scope
      and both reviewed siblings and could permit K0b-01 or affected checkpoint
      implementation without the required disposition.
    proposed_disposition: >-
      Revise the control delta without selecting an owner option: declare
      K0b-D03 activated and unresolved now, add it to the architecture-readiness,
      open-decision, implementation-blocker, and evidence criteria, and require
