  - finding_id: F-02
    type: unclosed_operational_run_state_machine
    severity: high
    blocking: true
    status: open
    title: The run transition graph uses completing and abort_requested without declaring them as run states
    evidence_refs:
      - new pipeline/architecture/k0b-00-shared-control-plane-delta-v1.md#3-state-machine-invariants-and-terminal-states
      - new pipeline/architecture/k0b-00-shared-control-plane-delta-v1.md#5-output-events-subscribers-terminal-policies-and-cross-plane-requests
      - new pipeline/architecture/k0b-00-shared-control-plane-delta-v1.md#9-failure-taxonomy-invalidation-replay-recovery-and-abort
      - new pipeline/architecture/k0a-00-shared-control-plane-v1.md#3-state-machine-invariants-and-terminal-states
      - new pipeline/decisions/d0-02-layer-architecture-gate.yaml#approval_criteria.machine_checkable
      - new pipeline/PIPELINE_V2_DEVELOPMENT_PLAN.md#K0b-01
    evidence:
      inherited_declared_run_states: [created, running, completed]
      explicitly_added_run_states: [waiting, reconciliation_required, reconciling, aborting, aborted, blocked, blocked_over_limit]
      graph_only_tokens: [completing, abort_requested]
      abort_event_type: run.abort_requested
      ambiguity: abort_requested_is_drawn_as_a_state_but_elsewhere_defined_as_an_event_without_an_event_labeled_transition
    impact: >-
      A deterministic compiler or state validator cannot derive one exhaustive
      state enum and transition table. Crash reconciliation at completion or
      abort can therefore classify the same durable position differently, and
      the closed-state/reference-equivalence acceptance claim is not currently
      executable.
    proposed_disposition: >-
      Revise section 3 to provide one exhaustive operational run-state enum and
      legal transition table. Either declare completing and abort_requested with
      their invariants and recovery behavior, or express run.abort_requested as
      an event-labeled transition directly into aborting and remove any
      undeclared pseudo-state. Add positive and negative compiler/reference
      cases for completion and abort recovery, including crash boundaries and
      stale-revision rejection.

