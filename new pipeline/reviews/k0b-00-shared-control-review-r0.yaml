      S owns semantic route, revision-owner, and freeze meaning; shared control
      owns deterministic compilation, scheduling, state, fencing, and replay
      subgraph computation; the artifact/event plane alone owns durable
      artifact/event/delivery/outbox/checkpoint persistence and project-Git
      publication. Layer0 and workers return bounded proposals only.
  current_roster_is_minimal_and_deferred_roster_is_honest:
    result: explicit_pass
